# 타입 검사와 테스트를 macOS·Windows 에서 돌린다. 테스트를 Mac 에서만 돌려 Windows 에서 깨지는 것을 늦게 알았다.
name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      # 멈추는 테스트가 있으면 전체가 끝나지 않는다 — 테스트마다 제한을 걸어 이름과 함께 실패로 남긴다
      - run: yarn test --test-timeout=120000
